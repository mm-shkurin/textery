<!doctype html>
<!-- ru, not en: every string this app renders is Russian. A wrong lang is not cosmetic — it is
     what a screen reader reads the pronunciation rules from, so "Сгенерировать" gets announced
     through an English voice. -->
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Textery</title>
    <!-- Inter is served from this origin (src/styles/fonts.css); there is no third-party font
         request to preconnect to any more. The cyrillic subset is preloaded because it is what
         every page of this Russian-language app needs first, and a font referenced only from a
         stylesheet is not discovered until that stylesheet has been parsed. -->
    <link
      rel="preload"
      href="/fonts/inter-cyrillic.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
