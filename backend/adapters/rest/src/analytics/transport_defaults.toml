# The bounds the analytics ingest route and the proxy-address parse work under.
#
# Data, not code, for the same reason the product's size limits are
# (`domain/src/shared/limits.toml`): each of these is a number a deployment may
# legitimately have to change -- a proxy chain grows, a bot wave forces the rate
# down -- and a change that has to clear lint, types and a test run before it can
# ship is a change that gets made on the running host instead.
#
# These are NOT product limits and deliberately do not live with them: they bound
# what one HTTP caller may cost this process, which is a transport concern the
# domain has no opinion about. Every key names the environment variable that
# overrides it; the file is the checked-in default, so a fresh clone runs with
# nothing exported.

[ingest]
# ANALYTICS_MAX_BODY_BYTES. Bounded on bytes actually read, never on the declared
# Content-Length -- a header claiming 10 is not a promise.
max_body_bytes = 16384
# ANALYTICS_EVENT_RATE_LIMIT and ANALYTICS_EVENT_RATE_WINDOW_SECONDS: the bound
# `endpoints.md` names, 120 events per source per 60 s. Named defaults rather
# than required variables -- every deployment declares them (Infra §3.2, §3.4),
# and one that forgets still runs with the documented numbers instead of
# unbounded.
event_rate_limit = 120
event_rate_window_seconds = 60

[proxy]
# TRUSTED_PROXY_HOPS. One: the repo's compose files put a single nginx in front
# of the application. Too high and a caller spoofs their address by padding the
# header; too low and the address stored is our own proxy's.
trusted_hops = 1
# MAX_FORWARDED_FOR_LENGTH. The header is caller-controlled, so the parse is
# bounded before it is split.
max_forwarded_for_length = 1024
