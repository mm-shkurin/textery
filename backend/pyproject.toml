[project]
name = "textery-backend"
version = "0.1.0"
description = "Textery backend — FastAPI, Clean Architecture (domain → usecase → adapters → application)."
requires-python = ">=3.12"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# --- Test runner -------------------------------------------------------------
# `pythonpath` replaces the hand-rolled `sys.path.insert` bootstrap every
# conftest used to carry. The layer roots are listed inner-first, which is also
# the dependency direction: a module can only import what is genuinely below it.
[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = [
    "domain/src",
    "usecase/src",
    "adapters/rest/src",
    "adapters/db/src",
    "adapters/security/src",
    "adapters/generation_provider/src",
    "adapters/oauth_provider/src",
    "adapters/rendering/src",
    "application/src/app",
    # Test-support roots, for the `statements` test-DSL packages. The two
    # `statements` directories carry no `__init__.py`, so they merge into one
    # implicit namespace package rather than shadowing each other.
    "domain/tests",
    "domain/tests/generation",
    "usecase/tests",
    "adapters/db/tests",
    "adapters/rest/tests",
    "adapters/security/tests",
    "adapters/rendering/tests",
    "adapters/generation_provider/tests",
    "adapters/generation_provider/tests/provider",
]

# --- Coverage ----------------------------------------------------------------
# `pytest --cov` with no source argument measures every imported file, tests
# included -- and the tests are ~100% covered by construction, because running
# them IS executing them. That inflated the reported number well above production
# coverage and made the 90% floor far weaker than it reads. Naming the src roots
# is what makes the gate mean "the code that ships is covered".
[tool.coverage.run]
source = [
    "domain/src",
    "usecase/src",
    "adapters/rest/src",
    "adapters/db/src",
    "adapters/security/src",
    "adapters/generation_provider/src",
    "adapters/oauth_provider/src",
    "adapters/rendering/src",
    "application/src",
]

# --- Linter / formatter ------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["adapters/db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "SIM", "UP", "ARG"]
ignore = [
    # FastAPI's whole dependency-injection idiom is a call in a default argument
    # (`Depends(...)`, `Header(...)`). B008 exists for mutable defaults; these are
    # neither mutable nor evaluated per request in a way that surprises anyone.
    "B008",
]

[tool.ruff.lint.per-file-ignores]
# The composition root imports only after it has put the layer roots on sys.path.
# ARG001: the lifespan callback's `app` parameter is Starlette's signature, not ours.
"application/src/app/main.py" = ["E402", "ARG001"]
# ARG001: `request` is Starlette's exception-handler signature. The handlers that
# only log the method and path still have to accept the whole object.
"adapters/rest/src/error_handling/exception_handlers.py" = ["ARG001"]
# ARG002: FakeProvider implements the GenerationProvider port. Ignoring the
# generation it is handed is exactly what makes it a fake.
"adapters/generation_provider/src/provider/fake_provider.py" = ["ARG002"]
# ARG002: AllowAllRateLimiter is the null object for the RateLimiter port. It
# never throttles, so ignoring the bucket key and the clock is its whole
# definition -- narrowing the signature would break the port instead.
"usecase/src/auth/oauth/rate_limiter.py" = ["ARG002"]
# ARG002: both renderers implement the one DocumentRenderer port, and the
# dispatcher has already routed on the enum by the time either is called -- each
# class owns exactly one format, so its own `export_format` is settled. Dropping
# the parameter would give the two implementations different signatures and
# there would be no port left to dispatch through.
# ARG001 (weasyprint only): `_blocked_url_fetcher` must match WeasyPrint's
# url_fetcher callback shape. It refuses every fetch, so ignoring the extra
# arguments is the whole point -- accepting them is what lets it be installed.
"adapters/rendering/src/rendering/html_docx_renderer.py" = ["ARG002"]
"adapters/rendering/src/rendering/weasyprint_pdf_renderer.py" = ["ARG001", "ARG002"]
# ARG001: nh3 calls `attribute_filter` with (tag, attribute, value). This filter
# decides on the attribute alone and is deliberately uniform across tags; the
# parameter is nh3's signature, not ours to narrow.
"adapters/security/src/sanitization/nh3_html_sanitizer.py" = ["ARG001"]

# --- Static type checker -----------------------------------------------------
# ruff answers style questions; nothing was answering type questions, even though
# every signature in this codebase is annotated. The annotations were decoration.
#
# `files` covers every production and test root. `conftest.py` is the one thing
# excluded: the layer roots are separate sys.path entries rather than one package
# tree, so all six conftests are the module `conftest` and mypy refuses the
# duplicate before checking anything else. Excluding six fixture files to type-
# check the ~90 test modules behind them is the trade; giving the test trees
# `__init__.py` would fix it properly but would also break the deliberate
# namespace-package merge of the two `statements` directories.
[tool.mypy]
python_version = "3.12"
explicit_package_bases = true
# The layers are separate roots on sys.path, not one package tree, so mypy needs
# the same map pytest gets from `pythonpath` above. A list, not a ":"-joined
# string: the separator is OS-specific and CI is Linux while development is not.
mypy_path = [
    "domain/src",
    "usecase/src",
    "adapters/rest/src",
    "adapters/db/src",
    "adapters/security/src",
    "adapters/generation_provider/src",
    "adapters/oauth_provider/src",
    "adapters/rendering/src",
    "application/src/app",
    "domain/tests",
    "domain/tests/generation",
    "usecase/tests",
    "adapters/db/tests",
    "adapters/rest/tests",
    "adapters/security/tests",
    "adapters/rendering/tests",
    "adapters/generation_provider/tests",
    "adapters/oauth_provider/tests",
    "application/tests",
]
files = [
    "domain/src",
    "usecase/src",
    "adapters/rest/src",
    "adapters/db/src",
    "adapters/security/src",
    "adapters/rendering/src",
    "adapters/generation_provider/src",
    "adapters/oauth_provider/src",
    "application/src",
    "domain/tests",
    "usecase/tests",
    "adapters/db/tests",
    "adapters/rest/tests",
    "adapters/security/tests",
    "adapters/rendering/tests",
    "adapters/generation_provider/tests",
    "adapters/oauth_provider/tests",
    "application/tests",
]
exclude = ['(^|/)conftest\.py$']
# NOTE: `disallow_incomplete_defs` is deliberately NOT set here, and the omission
# is not an oversight -- see the `strict-signatures` step in .github/workflows/ci.yml.
# A half-annotated signature passes the default settings: `def _validate_state(
# self, state, provider_name, now) -> None` counts as typed because of the return
# arrow, so the body is checked with every parameter an implicit Any, which
# propagates and swallows the errors inside it. Seven production functions were in
# that state, three of them in the OAuth callback.
#
# The flag belongs on production code only: test parameters are pytest fixtures
# whose types come from plugins and add nothing. It cannot be scoped here, because
# per-module overrides match module names and the layer roots are separate sys.path
# entries -- `usecase/src/auth/...` and `usecase/tests/auth/...` are both `auth.*`,
# so no pattern selects one without the other. mypy also rejects partial-component
# wildcards outright ("Patterns must be fully-qualified module names"). CI runs the
# flag over the src roots as a second, path-scoped invocation instead.

# Third-party packages without bundled stubs (asyncpg, nh3) would otherwise be
# 20 import errors drowning the 3 real ones.
ignore_missing_imports = true



[tool.ruff.lint.isort]
known-first-party = [
    "access",
    "analytics",
    "auth",
    "container",
    "document",
    "dto",
    "error_handling",
    "fake",
    "generation",
    "gigachat_fixtures",
    "hashing",
    "health",
    "logging_config",
    "model",
    "project",
    "prompt_fixtures",
    "provider",
    "refusal_guard",
    "rendering",
    "router",
    "sanitization",
    "security",
    "session",
    "shared",
    "statements",
    "tokens",
]
