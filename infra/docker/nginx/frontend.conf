server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Mirrors the Vite dev proxy (/api -> backend) so the built SPA can call
    # the API through the same origin without a VITE_API_BASE_URL override.
    #
    # DO NOT make this location answer 503 without reading
    # frontend/src/features/generation/hooks/autosaveRetryPolicy.ts first.
    # `mayHaveLandedServerSide` treats 503 as the one 5xx that PROVES the write
    # was never taken, and on that answer the autosave retry SKIPS the write.
    # That is only safe while nothing in front of the origin can emit 503 after
    # a write has been accepted. A `limit_req`/`limit_conn` zone, an
    # `error_page`, `max_fails`/`proxy_next_upstream` upstream failover, or a
    # WAF added here all break the premise, and the failure is silent: the
    # editor shows «Сохранено» over content the server never got. No test can
    # catch it — this comment is the only guard. Change the frontend branch in
    # the same commit, or do not add the directive.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
