server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ABOVE the application's own body cap, never below it. Unset, nginx enforces
    # its 1 MiB default, which is smaller than the largest legitimate request in
    # the product (documents_save allows 200 000 code points, ~800 KB as UTF-8
    # before JSON escaping) -- and it refuses with an nginx HTML error page, not
    # {error_code, message}. Every browser request crosses this proxy, so that
    # default made the canonical 413 unreachable for real users while acceptance
    # tests hitting BACKEND_PORT directly went green on it. Set at or below the
    # app cap and the same thing happens again.
    client_max_body_size 4m;

    # Mirrors the Vite dev proxy (/api -> backend) so the built SPA can call
    # the API through the same origin without a VITE_API_BASE_URL override.
    #
    # DO NOT make this conf — or anything in front of the origin — answer 503
    # without reading frontend/src/features/generation/hooks/autosaveRetryPolicy.ts
    # first. `mayHaveLandedServerSide` treats 503 as the one 5xx that PROVES the
    # write was never taken, so on a 503 the autosave KEEPS its memory of the
    # last saved content; if the user then reverts to that content during the
    # backoff window, the retry's fire-time gate suppresses the write entirely.
    # On every other 5xx the memory is dropped and the write always goes out.
    # That carve-out is only safe while nothing in front of the origin can emit
    # 503 after a write has been accepted. A `limit_req`/`limit_conn` zone (at
    # `http`/`server` level too — it inherits into this location), an
    # `error_page` maintenance page, `max_fails`/`proxy_next_upstream` failover
    # via a new `upstream` block, a WAF, or the host/prod-copy reverse proxy in
    # front of this container all break the premise. The failure is silent: the
    # editor shows «Сохранено» over content the server never got. The hops
    # outside this repo have no guard but this comment; THIS conf is scanned by
    # frontend/scripts/check-nginx-503.mjs (`npm run check:ingress`, a CI step),
    # so adding one of those directives here fails the build and quotes the
    # line. Change the frontend branch in the same commit, or do not add the
    # directive.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # The backend's liveness endpoint, which lives at the ROOT of the API app and
    # not under /api/, so the proxy above never matched it. Without this the path
    # fell through to the SPA below and answered 200 with index.html: a green
    # health check that proves only that nginx is serving files, while the
    # backend behind it could be dead. `=` so it matches this one path exactly.
    location = /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
