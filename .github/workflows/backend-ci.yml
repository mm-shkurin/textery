name: backend-ci

on:
  push:
    branches: [main, dev]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

defaults:
  run:
    working-directory: backend

# The gates below are the same five the published repository's own workflow
# (backend/.github/workflows/ci.yml) runs. They were missing here, and THIS is the
# workflow that triggers on monorepo pushes -- so a tip that was red on file size
# and on mypy went green for weeks. Keep the two files in step: the split repo is
# built from its copy, this one from the monorepo, and only one of them is what a
# developer sees fail.
jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install ruff
        run: pip install "$(grep -E '^ruff==' requirements-dev.txt)"

      - name: Check lint rules
        run: ruff check --output-format=github .

      - name: Check formatting
        run: ruff format --check .

      # In `lint` rather than a job of its own: it needs nothing installed, not
      # even ruff, so a separate runner would spend more time starting than
      # checking. Added because this was the one rule in
      # .claude/rules/coding-rules.md with no gate behind it -- and it had eight
      # violations, which is what an ungated rule reliably collects.
      - name: Check file sizes
        run: python scripts/check_file_size.py

  # Its own job, and not folded into `lint`: mypy needs the runtime dependencies
  # installed to see FastAPI's and SQLAlchemy's own type information, which the
  # ruff-only job deliberately skips to stay fast. It still needs no database.
  types:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      # requirements-dev.txt pulls in requirements.txt itself: the suite imports
      # the application, and mypy needs FastAPI's and SQLAlchemy's own type
      # information before it can check anything useful.
      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Check types
        run: mypy

      # Production code only, and a second invocation rather than a setting in
      # pyproject.toml, because the flag cannot be scoped there. Per-module
      # overrides match module names, and the layer roots are separate sys.path
      # entries -- `usecase/src/auth/...` and `usecase/tests/auth/...` are both
      # `auth.*`, so no pattern selects one without the other. Paths do separate
      # them, and this is the only place paths can be given.
      #
      # What it catches: a signature annotated in part. `def _validate_state(self,
      # state, provider_name, now) -> None` passes the default settings, because
      # the return arrow alone makes it a typed function -- the body is then
      # checked with every parameter an implicit Any, which propagates and hides
      # the errors inside. Seven production functions were in that state, three of
      # them in the OAuth callback.
      - name: Check production signatures are fully annotated
        run: >
          mypy --disallow-incomplete-defs
          domain/src usecase/src
          adapters/rest/src adapters/db/src adapters/security/src
          adapters/rendering/src adapters/generation_provider/src
          adapters/oauth_provider/src
          application/src

  # Blocking, not advisory. Every dependency here is pinned to an exact version,
  # which is what makes the build reproducible -- and also what makes a known
  # vulnerability sit in the lockfile until somebody looks. Nobody was looking.
  # It runs on the requirements file rather than the installed environment, so it
  # answers for what deploys, not for whatever the runner happens to have.
  audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install pip-audit
        run: pip install pip-audit==2.9.0

      # requirements.txt, not requirements-dev.txt: this job answers "is what we
      # deploy vulnerable". A CVE in pytest or ruff is worth knowing about but is
      # not a production exposure, and mixing the two makes a red result
      # ambiguous about which it is.
      - name: Check dependencies for known vulnerabilities
        run: pip-audit -r requirements.txt --progress-spinner=off


  test:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql+asyncpg://textery:change-me@localhost:5432/textery
      # `textery_test`, NOT `textery`. The db suite TRUNCATEs every table between
      # fixtures, and adapters/db/tests/statements/database_url.py refuses any target
      # whose name does not say `test` - a guard added after a full pytest run against
      # a live stack wiped a developer's local data on 2026-08-06. CI pointed here at
      # the app's own database, so every db test errored out on that guard.
      TEST_DATABASE_URL: postgresql://textery:change-me@localhost:5432/textery_test
      REDIS_URL: redis://localhost:6379/0
      GENERATION_PROVIDER: fake

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install postgres and redis
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql redis-server
          sudo pg_ctlcluster 16 main start
          sudo redis-server --daemonize yes --bind 127.0.0.1

      - name: Wait for postgres and redis
        run: |
          for i in $(seq 1 30); do
            pg_isready -h localhost -p 5432 && break
            sleep 2
          done
          for i in $(seq 1 30); do
            redis-cli -h localhost ping && break
            sleep 2
          done

      - name: Create database and user
        run: |
          sudo -u postgres psql -c "CREATE USER textery WITH PASSWORD 'change-me' SUPERUSER;"
          sudo -u postgres psql -c "CREATE DATABASE textery OWNER textery;"
          # Two databases, because the suite empties the one it is pointed at. `textery` is
          # what the application config names; `textery_test` is the only one the db suite is
          # allowed to touch.
          sudo -u postgres psql -c "CREATE DATABASE textery_test OWNER textery;"

      # WeasyPrint's native Pango/cairo libs, so the rendering-adapter test runs
      # here instead of importorskip-ing itself into a silent skip. Matches
      # infra/docker/backend.Dockerfile and the backend/.github copy.
      - name: Install render libraries (WeasyPrint)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangocairo-1.0-0 libharfbuzz0b \
            libgdk-pixbuf-2.0-0 libffi8 fonts-dejavu-core

      # requirements-dev.txt, which pulls in requirements.txt itself. The runtime
      # file alone no longer carries pytest -- see the note at the top of it.
      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run migrations
        working-directory: backend/adapters/db
        run: alembic upgrade head

      # The db suite connects to textery_test, which alembic has never seen: the step
      # above migrates whatever DATABASE_URL names, and that is the application's
      # database. Without this the tables the suite TRUNCATEs and reads do not exist,
      # and the failure arrives as a relation-does-not-exist per test rather than as
      # "the test database was never migrated".
      - name: Run migrations on the test database
        working-directory: backend/adapters/db
        env:
          DATABASE_URL: postgresql+asyncpg://textery:change-me@localhost:5432/textery_test
        run: alembic upgrade head

      - name: Run tests with coverage
        run: pytest --cov --cov-report=xml:coverage.xml --cov-fail-under=90

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

  docker-image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f infra/docker/backend.Dockerfile .
        working-directory: .
