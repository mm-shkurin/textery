openapi: 3.0.3
info:
  title: Queue an AI Edit of a Document
  version: 1.0.0

paths:
  /api/v1/documents/{document_id}/ai-edits:
    post:
      summary: Queue an AI edit of the document; the document is not mutated at request time
      operationId: createDocumentAiEdit
      tags:
        - ai-edits
      security:
        - bearerAuth: []
      parameters:
        - name: document_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: Idempotency-Key
          in: header
          required: true
          description: >
            Scoped to (account, document) and bound to a fingerprint of (message,
            selection, base_version). Replay of the same key WITH THE SAME BODY returns
            the SAME edit_id and the edit's CURRENT status — never a second edit, never a
            second chat message. A different key with an identical body creates a new
            edit. Reusing a key with a DIFFERENT body is a 422, never a silent 202
            returning the earlier edit — which would discard the user's new instruction
            while reporting success. Missing or blank rejects before any row is written.
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAiEditRequest'
      responses:
        '202':
          description: >
            Accepted and enqueued. On a FIRST submission status is server-set to exactly
            `queued`; it cannot be set at construction from any input path. An idempotent
            replay returns the same edit_id with the edit's CURRENT status, which may
            already be terminal — a replay arriving seconds later stays representable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiEditAcceptedResponse'
        '400':
          description: >
            Semantically invalid though well-typed: an empty or inverted selection range
            ({start:0,end:0}, start >= end), a selection out of range for base_version, a
            blank message, a message over the code-point limit, or a whole-document edit
            on a document above the context-fit threshold (a selection is required above
            it — distinct error_code). Shape violations are 422, not 400 — see below.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing, malformed, expired, or non-access Bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: >
            No document with this id FOR THIS OWNER; a foreign document is byte-identical
            to an absent one — never 403. Takes precedence over 409, so the response
            cannot disclose that base_version was correct.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >
            Either base_version does not match the document's current version, or an
            edit for this document is already non-terminal (one active edit per
            document, enforced by a DB uniqueness/CAS check so two instances cannot
            both win).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: >
            SHAPE violations — every wrong-type or missing-required field, uniformly with
            documents_save.yaml: base_version absent, null, 0 or non-integer; message
            absent or not a string; `selection: null` or {start:null,end:null} (explicit
            null is a type violation, and is NOT the same input as an omitted selection,
            which means whole-document); Idempotency-Key absent, blank, or reused with a
            body whose fingerprint differs. Rejected before any row is written.
            Server-owned body fields (status, edit_id, account_id, document_id,
            created_at, seq, quota fields, version, revision_number) are IGNORED.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Daily per-account edit quota exhausted; body carries the reset hint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuotaError'
        '500':
          description: Internal server error — generic client-safe message only.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from POST /api/v1/auth/login.
  schemas:
    Error:
      type: object
      required:
        - error_code
        - message
      properties:
        error_code:
          type: string
        message:
          type: string
    QuotaError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          required:
            - resets_at
          properties:
            resets_at:
              type: string
              format: date-time
              description: Start of the next quota day in the server's canonical zone.
    Selection:
      type: object
      required:
        - start
        - end
      properties:
        start:
          type: integer
          minimum: 0
          description: >
            Inclusive start offset in Unicode CODE POINTS (not UTF-16 units, not bytes)
            into the NFC content at base_version.
        end:
          type: integer
          minimum: 1
          description: Exclusive end offset in code points; 0 <= start < end <= len(content).
    CreateAiEditRequest:
      type: object
      required:
        - message
        - base_version
      properties:
        message:
          type: string
          minLength: 1
          description: >
            The user's instruction. Non-blank, max length in Unicode code points (pinned
            like MAX_REQUIREMENTS_LENGTH). Stored as text, never rendered as HTML.
        selection:
          allOf:
            - $ref: '#/components/schemas/Selection'
          nullable: false
          description: >
            OMITTED means edit the whole document. Explicit null (422) or an empty range
            (400) is never a silent whole-document rewrite.
        base_version:
          type: integer
          minimum: 1
          description: >
            The version the edit applies against, like the manual PUT /documents/{id}
            save. Mismatch returns 409.
    AiEditAcceptedResponse:
      type: object
      required:
        - edit_id
        - status
      properties:
        edit_id:
          type: string
          format: uuid
          description: Opaque identifier; scoped to document_id on every subsequent call.
        status:
          type: string
          enum: [queued, streaming, done, error, cancelled]
          description: >
            `queued` on a first submission; an idempotent replay returns the edit's
            current status, so any value is legal.
