openapi: 3.0.3
info:
  title: Queue an AI Edit of a Document
  version: 1.0.0

paths:
  /api/v1/documents/{document_id}/ai-edits:
    post:
      summary: Queue an AI edit of the document; the document is not mutated at request time
      operationId: createDocumentAiEdit
      tags:
        - ai-edits
      security:
        - bearerAuth: []
      parameters:
        - name: document_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          description: >
            Replay of the same key returns the SAME edit_id — never a second edit and
            never a second chat message. A different key with an identical body creates
            a new edit. Missing or blank rejects before any row is written.
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAiEditRequest'
      responses:
        '202':
          description: >
            Accepted and enqueued. Status is server-set to exactly `queued`; it cannot
            be set at construction from any input path.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiEditAcceptedResponse'
        '400':
          description: >
            Invalid selection (null, {start:null,end:null}, {start:0,end:0}, start >= end,
            out of range for base_version), blank message, message over the code-point
            limit, or a whole-document edit on a document above the context-fit threshold
            (a selection is required above it — distinct error_code).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing, malformed, expired, or non-access Bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: >
            No document with this id FOR THIS OWNER. A document owned by another account
            is byte-identical to one that does not exist — never 403. Takes precedence
            over 409, so the response cannot disclose that base_version was correct.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >
            Either base_version does not match the document's current version, or an
            edit for this document is already non-terminal (one active edit per
            document, enforced by a DB uniqueness/CAS check so two instances cannot
            both win).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: >
            base_version absent, null, 0, or not an integer; Idempotency-Key absent or
            blank. Rejected before any row is written. Server-owned fields in the body
            (status, edit_id, account_id, document_id, created_at, seq, quota fields,
            version, revision_number) are IGNORED, not honoured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Daily per-account edit quota exhausted; body carries the reset hint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuotaError'
        '500':
          description: Internal server error — generic client-safe message only.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from POST /api/v1/auth/login.
  schemas:
    Error:
      type: object
      required:
        - error_code
        - message
      properties:
        error_code:
          type: string
        message:
          type: string
    QuotaError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          required:
            - resets_at
          properties:
            resets_at:
              type: string
              format: date-time
              description: Start of the next quota day in the server's canonical zone.
    Selection:
      type: object
      required:
        - start
        - end
      properties:
        start:
          type: integer
          minimum: 0
          description: >
            Inclusive start offset in Unicode CODE POINTS (not UTF-16 units, not bytes)
            into the NFC-normalized content at base_version.
        end:
          type: integer
          minimum: 1
          description: Exclusive end offset in code points; 0 <= start < end <= len(content).
    CreateAiEditRequest:
      type: object
      required:
        - message
        - base_version
      properties:
        message:
          type: string
          minLength: 1
          description: >
            The user's instruction. Non-blank, max length measured in Unicode code
            points (pinned like MAX_REQUIREMENTS_LENGTH). Stored as text, never
            rendered as HTML.
        selection:
          allOf:
            - $ref: '#/components/schemas/Selection'
          nullable: false
          description: >
            OMITTED means edit the whole document. Explicit null or an empty range is a
            4xx, never a silent whole-document rewrite.
        base_version:
          type: integer
          minimum: 1
          description: >
            The document version the edit applies against, exactly like the manual
            PUT /documents/{id} save. Mismatch returns 409.
    AiEditAcceptedResponse:
      type: object
      required:
        - edit_id
        - status
      properties:
        edit_id:
          type: string
          format: uuid
          description: Opaque identifier; scoped to document_id on every subsequent call.
        status:
          type: string
          enum: [queued]
