openapi: 3.0.3
info:
  title: List Document Revisions
  version: 1.0.0

paths:
  /api/v1/documents/{document_id}/revisions:
    get:
      summary: Revision history for the document, keyset-paginated
      operationId: listDocumentRevisions
      tags:
        - documents
      security:
        - bearerAuth: []
      parameters:
        - name: document_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          description: >
            CLAMPED, not rejected: a value above the server cap of 100 is silently
            reduced to 100, never unbounded. No `maximum` is declared, deliberately, so
            the clamp stays testable through a generated client. A non-integer or
            negative value is a 400, never interpolated.
          schema:
            type: integer
            minimum: 1
            default: 50
        - name: cursor
          in: query
          required: false
          description: >
            Opaque keyset cursor. Order is FIXED server-side (newest first) and is not a
            client parameter — there is no `order` query parameter. Stable under
            concurrent inserts.
          schema:
            type: string
      responses:
        '200':
          description: >
            One page of revisions, newest first. The list view NEVER returns document
            content — only metadata. A revision written by an edit is present as soon
            as that edit's terminal done event is visible. Constant query count per page.

            REVISION ORIGIN — a document that has never been edited (created before this
            story, or created and never AI-edited) has an empty history and returns a
            valid EMPTY page. The FIRST mutation of such a document writes TWO revisions
            in the same transaction: revision 1 carrying the PRE-mutation content with
            source `manual`, then revision 2 carrying the result. Without that baseline
            the first AI edit would be unrollbackable — restore could only reach
            post-edit states — which defeats the story's rollback promise.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevisionPage'
        '400':
          description: >
            limit non-integer or below 1, or an unparseable/forged cursor. A limit above
            the cap is clamped, not rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing, malformed, expired, or non-access Bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: >
            No document with this id FOR THIS OWNER — byte-identical for absent and
            foreign; never 403.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error — generic client-safe message only.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from POST /api/v1/auth/login.
  schemas:
    Error:
      type: object
      required:
        - error_code
        - message
      properties:
        error_code:
          type: string
        message:
          type: string
    Revision:
      type: object
      required:
        - revision_number
        - version
        - source
        - created_at
      properties:
        revision_number:
          type: integer
          minimum: 1
          description: >
            Per-document, monotonically increasing. History only grows — a restore adds
            a revision, it never removes one.
        version:
          type: integer
          description: The document version this revision's content became.
        source:
          type: string
          enum: [manual, ai, restore]
          description: >
            Server-set. An unrecognized value follows the stated unknown-enum policy —
            never silently coerced to the first constant.
        created_at:
          type: string
          format: date-time
        restored_from:
          type: integer
          nullable: true
          description: Present only when source is restore; the revision_number it copied.
    RevisionPage:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Revision'
        next_cursor:
          type: string
          nullable: true
          description: Absent or null on the last page.
