openapi: 3.0.3
info:
  title: Export Document to PDF / DOCX
  version: 1.0.0

paths:
  /api/v1/documents/{document_id}/export:
    get:
      summary: Render a document to PDF or DOCX and stream it
      description: >
        Renders the document's stored sanitized HTML to the requested format in memory and
        streams it — nothing is written to disk (multi-instance rule). Read-only: export
        never mutates the document or runs generation.


        The PDF renderer's network fetch is disabled, so an embedded external URL cannot
        cause an outbound request (SSRF-safe). The filename is derived from the document
        title, RFC 5987-encoded for non-ASCII, and stripped of CR/LF/quotes so it cannot
        inject into the Content-Disposition header.
      operationId: exportDocument
      tags:
        - documents
      security:
        - bearerAuth: []
      parameters:
        - name: document_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: format
          in: query
          required: true
          description: Output format. Any value other than pdf or docx is rejected.
          schema:
            type: string
            enum: [pdf, docx]
      responses:
        '200':
          description: >
            The rendered file, streamed. Content-Type is application/pdf or the DOCX
            wordprocessingml type. Content-Disposition is attachment with an RFC
            5987-encoded filename derived from the title (default document.pdf/.docx when
            the title is absent).

            The render applies the document's page_settings (story 10) — sheet size,
            orientation, margins, font size, line height, headers/footers and page
            numbering — reading the default preset when page_settings is null. Manual
            page breaks in the content are honoured. A 200 always carries EVERY
            requested element: if geometry, a manual break, a header/footer or the
            numbering cannot be applied, the export fails (500) rather than returning a
            file with that element silently omitted.

            PDF and DOCX do not carry the same guarantee. The PDF is laid out by
            WeasyPrint, a different engine from the browser the editor runs in, so its
            page boundaries are NOT claimed to match the editor's (known-debt #14). Word
            repaginates a DOCX on open, so there the pages start where a manual break was
            placed but may end elsewhere — unreachable by any implementation, a property
            of the format.
          headers:
            Content-Disposition:
              schema:
                type: string
              description: attachment; filename*=UTF-8''<encoded-title>.<ext>
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema:
                type: string
                format: binary
        '401':
          description: >
            Missing, malformed, expired, or non-access Bearer token. A refresh token
            presented here is rejected like any other invalid token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: >
            The document does not exist OR is owned by another account — byte-identical in
            both cases (never 403, which would confirm the id exists). No file.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Missing or unsupported format (not pdf or docx). No file.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: >
            Render failure or render-deadline abort — generic client-safe message only, no
            DB text, filesystem path, id shape, or stack frame. Emits a server-side signal
            keyed by document id.

            Includes the case where the bundled document font does not resolve. That is
            deliberately a hard failure and not a substitution: WeasyPrint's blocked
            url_fetcher raises per resource but WeasyPrint logs and continues, so a
            missing face would otherwise yield a successful 200 laid out in fallback
            metrics — a wrong document that looks like a right one. The font's presence is
            additionally validated at boot, so this branch covers runtime loss, not a
            misbuilt image.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Access token from POST /api/v1/auth/login. Documents are owned; see
        decisions/document-ownership-decision.md.
  schemas:
    Error:
      type: object
      required:
        - error_code
        - message
      properties:
        error_code:
          type: string
        message:
          type: string
