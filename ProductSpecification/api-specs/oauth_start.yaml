openapi: 3.0.3
info:
  title: OAuth start (VK ID / Yandex ID)
  version: 1.0.0

paths:
  /api/v1/auth/oauth/{provider}/start:
    get:
      summary: >
        Begin the backend-mediated OAuth handshake. Full-page browser navigation target
        of the provider button; 302-redirects to the provider's authorization page.
      operationId: oauthStart
      tags:
        - auth
      parameters:
        - name: provider
          in: path
          required: true
          description: OAuth provider. Any value outside the enum is rejected, not defaulted.
          schema:
            type: string
            enum: [vk, yandex]
        - name: utm_source
          in: query
          required: false
          schema: { type: string, maxLength: 200 }
          description: >
            First-touch attribution carried into the OAuth handshake (story 14). The
            account is created at `/callback`, two redirects away from any body the client
            controls, so without these the entire OAuth sign-up channel would register
            with NULL attribution and CAC-by-UTM would measure only the email channel.
            The backend stores them against the `state` row it already keeps and reads
            them back when the callback creates the account; they are never echoed to the
            provider. Same bound, normalization and drop-not-truncate rule as
            `auth_register.yaml` § UtmValue: a value over the bound, undecodable, or
            unstorable makes the whole five-value set unstorable — all five are stored
            NULL and the handshake proceeds. This route answers 302/404/500 and NO 400,
            before story 14 and after it: a marketing link with a malformed parameter must
            never end at a broken sign-in, and story 14 does not add a response class to
            story 16's contract.
        - name: utm_medium
          in: query
          required: false
          schema: { type: string, maxLength: 200 }
        - name: utm_campaign
          in: query
          required: false
          schema: { type: string, maxLength: 200 }
        - name: utm_content
          in: query
          required: false
          schema: { type: string, maxLength: 200 }
        - name: utm_term
          in: query
          required: false
          schema: { type: string, maxLength: 200 }
      responses:
        '302':
          description: >
            Redirect to the provider auth page. The backend sets client_id, the registered
            redirect_uri, requested scope (email + basic profile), and a CSRF `state` — all
            held server-side; the client sees none of them. Config missing/blank at boot
            fails fast, never a lazy dev-fallback (hazard-scan group 7).
          headers:
            Location:
              schema:
                type: string
              description: Provider authorization URL.
        '404':
          description: Unknown provider (outside the vk|yandex enum).
        # No '400'. This route has never had one and story 14 does not add one: the utm_*
        # query parameters are fail-open analytics metadata, dropped when unusable, and a
        # dropped parameter still redirects (see the utm_source description above).
        '500':
          description: >
            Internal server error (e.g. OAuth provider config unset). Fails closed —
            no redirect to a half-configured provider.
