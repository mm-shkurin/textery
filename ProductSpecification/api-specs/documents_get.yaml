openapi: 3.0.3
info:
  title: Get Document
  version: 1.0.0

paths:
  /api/v1/documents/{document_id}:
    get:
      summary: Fetch a document (reopen for continued manual editing)
      operationId: getDocument
      tags:
        - documents
      security:
        - bearerAuth: []
      parameters:
        - name: document_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentResponse'
        '401':
          description: Missing, malformed, expired, or non-access Bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: >
            No document with this id FOR THIS OWNER. A document owned by another
            account is indistinguishable from one that does not exist — never 403,
            which would confirm the id exists. See
            decisions/document-ownership-decision.md.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error — generic client-safe message only.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from POST /api/v1/auth/login.
  schemas:
    Error:
      type: object
      required:
        - error_code
        - message
      properties:
        error_code:
          type: string
        message:
          type: string
    DocumentResponse:
      type: object
      properties:
        document_id:
          type: string
          format: uuid
        document_type:
          type: string
        status:
          type: string
          enum: [draft]
        content:
          type: string
          description: Sanitized HTML; reflects the last successfully saved state (post-sanitization, not necessarily byte-identical to what was submitted).
        version:
          type: integer
          description: Optimistic-concurrency token; required on subsequent PUT.
        page_settings:
          allOf:
            - $ref: '#/components/schemas/PageSettings'
          nullable: true
          description: >
            Page geometry, or null when the document has never been configured — the
            client then renders the default preset. Defaults are NOT materialized into
            the response, so "never configured" and "configured to the current
            defaults" remain distinguishable; a later change to the preset therefore
            reaches old documents rather than being frozen into them.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PageSettings:
      type: object
      additionalProperties: false
      description: >
        Page geometry for the whole document. Read-side contract; the writable
        definition with full validation rules lives in documents_save.yaml. A stored
        object missing a key added in a later release reads as that key's default; one
        carrying a key or enum constant this version does not define is preserved and
        read as the default, never crashing and never downgrading the whole object.
      properties:
        page_size:
          type: string
          enum: [A4, A5, Letter]
        orientation:
          type: string
          enum: [portrait, landscape]
        margins_mm:
          type: object
          additionalProperties: false
          required: [top, right, bottom, left]
          properties:
            top: {type: number}
            right: {type: number}
            bottom: {type: number}
            left: {type: number}
        font_size_pt:
          type: number
        line_height:
          type: number
        header_text:
          type: string
          nullable: true
        footer_text:
          type: string
          nullable: true
        show_page_numbers:
          type: boolean
        skip_number_on_first_page:
          type: boolean
