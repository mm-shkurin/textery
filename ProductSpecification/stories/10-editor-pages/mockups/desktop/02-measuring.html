<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1400">
<title>Textery — Редактор: расчёт страниц</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="pages.css">
</head>
<body>
  <!-- Состояние «шрифт грузится / идёт замер».
       Вёрстка НЕ считается на подменном шрифте: счётчик страниц не показывается,
       пока документный шрифт не подтверждён загруженным. Это состояние обязано
       отличаться и от ошибки, и от пустого документа. -->
  <div class="topbar">
    <div class="logo"><div class="logo-mark"><i data-lucide="sparkles" style="width:16px;height:16px;"></i></div>Textery</div>
    <div class="header-actions">
      <button class="icon-btn"><i data-lucide="bell"></i></button>
      <div class="avatar">АИ</div><i data-lucide="chevron-down"></i>
    </div>
  </div>

  <div class="crumbs">
    <div class="back"><i data-lucide="arrow-left" style="width:15px;height:15px;"></i>Мои проекты</div>
    <span class="muted">/</span>
    <span class="tag">Реферат</span>
    <span class="title">История ИИ</span>
    <div class="right">
      <button class="btn btn-ghost" style="padding:10px 20px; opacity:.5;"><i data-lucide="settings-2"></i>Параметры страницы</button>
      <button class="btn btn-ghost" style="padding:10px 20px; opacity:.5;"><i data-lucide="download"></i>Скачать</button>
    </div>
  </div>

  <div class="fmtbar" style="opacity:.45;">
    <i data-lucide="heading-1"></i><i data-lucide="heading-2"></i><div class="sep"></div>
    <i data-lucide="bold"></i><i data-lucide="italic"></i><i data-lucide="underline"></i>
    <div class="sep"></div><i data-lucide="list"></i><i data-lucide="align-left"></i>
    <div class="sep"></div><i data-lucide="separator-horizontal"></i>
  </div>

  <div class="layout">
    <div class="pages">
      <div class="cap">СТРАНИЦЫ</div>
      <div class="skeleton"></div>
      <div class="skeleton"></div>
      <div class="skeleton" style="opacity:.5;"></div>
    </div>

    <div class="doc-wrap">
      <div class="doc">
        <div class="sheet measuring">
          <div class="spinner"></div>
          <div style="font-size:14px; color:var(--text-secondary);">Готовим страницы…</div>
          <div style="font-size:12.5px; max-width:340px; text-align:center;">
            Загружаем шрифт документа. Разбивка появится, когда шрифт будет готов —
            иначе число страниц изменилось бы у вас на глазах.
          </div>
          <div style="width:520px; margin-top:12px;">
            <div class="skeleton-line" style="width:60%; margin-bottom:12px; height:20px;"></div>
            <div class="skeleton-line" style="margin-bottom:9px;"></div>
            <div class="skeleton-line" style="margin-bottom:9px;"></div>
            <div class="skeleton-line" style="width:82%; margin-bottom:9px;"></div>
            <div class="skeleton-line" style="width:91%;"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="statusbar">
    <span>Расчёт страниц…</span>
    <span>A4, книжная</span>
  </div>
  <script>lucide.createIcons();</script>
</body>
</html>
