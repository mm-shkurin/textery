<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1400">
<title>Textery — Пустой документ</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="pages.css">
</head>
<body>
  <!-- Пустой документ — ОДИН чистый лист, а не спиннер и не заглушка.
       Счётчик показывает «Страница 1 из 1»: пустой документ занимает страницу,
       как в любом текстовом редакторе. -->
  <div class="topbar">
    <div class="logo"><div class="logo-mark"><i data-lucide="sparkles" style="width:16px;height:16px;"></i></div>Textery</div>
    <div class="header-actions">
      <button class="icon-btn"><i data-lucide="bell"></i></button>
      <div class="avatar">АИ</div><i data-lucide="chevron-down"></i>
    </div>
  </div>

  <div class="crumbs">
    <div class="back"><i data-lucide="arrow-left" style="width:15px;height:15px;"></i>Мои проекты</div>
    <span class="muted">/</span><span class="tag">Эссе</span>
    <span class="title muted">Без названия</span>
    <div class="right">
      <button class="btn btn-ghost" style="padding:10px 20px;"><i data-lucide="settings-2"></i>Параметры страницы</button>
      <button class="btn btn-ghost" style="padding:10px 20px; opacity:.5;"><i data-lucide="download"></i>Скачать</button>
    </div>
  </div>

  <div class="fmtbar">
    <i data-lucide="heading-1"></i><i data-lucide="heading-2"></i><div class="sep"></div>
    <i data-lucide="bold"></i><i data-lucide="italic"></i><i data-lucide="underline"></i>
    <div class="sep"></div><i data-lucide="list"></i><i data-lucide="align-left"></i>
    <div class="sep"></div><i data-lucide="separator-horizontal"></i>
    <div class="sep"></div><i data-lucide="more-horizontal"></i>
  </div>

  <div class="layout">
    <div class="pages">
      <div class="cap">СТРАНИЦЫ</div>
      <div class="page-item active">
        <div class="sq"><i data-lucide="file-text" style="width:15px;height:15px;"></i></div>
        <div>Страница 1<div class="st">Активная</div></div>
      </div>
      <div class="add"><i data-lucide="separator-horizontal" style="width:15px;height:15px;"></i>Вставить разрыв страницы</div>
      <div class="setup">
        <div class="add"><i data-lucide="settings-2" style="width:15px;height:15px;"></i>Параметры страницы</div>
      </div>
    </div>

    <div class="doc-wrap">
      <div class="doc">
        <div class="sheet a4">
          <p class="empty-hint"><span class="caret"></span> Начните печатать…</p>
        </div>
      </div>
    </div>
  </div>

  <div class="statusbar">
    <span>0 слов · Черновик</span>
    <span>Страница 1 из 1 · A4, книжная</span>
  </div>
  <script>lucide.createIcons();</script>
</body>
</html>
