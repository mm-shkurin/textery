<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=375">
<title>Textery — Пустой документ</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="pages.css">
</head>
<body>
  <!-- Пустой документ — один чистый лист, не спиннер и не заглушка.
       «Стр. 1 из 1»: пустой документ занимает страницу. -->
  <div class="topbar">
    <i data-lucide="arrow-left"></i>
    <div class="t muted">Без названия</div>
    <span class="tag">Эссе</span>
    <i data-lucide="more-vertical"></i>
  </div>

  <div class="fmtbar">
    <i data-lucide="heading-1"></i><i data-lucide="heading-2"></i>
    <i data-lucide="bold"></i><i data-lucide="italic"></i><i data-lucide="underline"></i>
    <i data-lucide="list"></i><i data-lucide="align-left"></i>
    <i data-lucide="separator-horizontal"></i><i data-lucide="settings-2"></i>
  </div>

  <div class="strip">
    <div class="chip active"><i data-lucide="file-text"></i>Стр. 1</div>
  </div>

  <div class="doc-wrap">
    <div class="sheet a4">
      <p class="empty-hint"><span class="caret"></span> Начните печатать…</p>
    </div>
  </div>

  <div class="statusbar">
    <span>0 слов · Черновик</span>
    <span>Стр. 1 из 1 · A4</span>
  </div>
  <script>lucide.createIcons();</script>
</body>
</html>
