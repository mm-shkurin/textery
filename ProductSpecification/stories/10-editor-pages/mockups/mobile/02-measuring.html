<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=375">
<title>Textery — Расчёт страниц</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="pages.css">
</head>
<body>
  <!-- Шрифт документа ещё грузится. Число страниц не показываем: посчитанное
       на подменном шрифте, оно изменилось бы у пользователя на глазах. -->
  <div class="topbar">
    <i data-lucide="arrow-left"></i>
    <div class="t">История ИИ</div>
    <span class="tag">Реферат</span>
    <i data-lucide="more-vertical"></i>
  </div>

  <div class="fmtbar" style="opacity:.45;">
    <i data-lucide="heading-1"></i><i data-lucide="heading-2"></i>
    <i data-lucide="bold"></i><i data-lucide="italic"></i><i data-lucide="underline"></i>
    <i data-lucide="list"></i><i data-lucide="align-left"></i>
    <i data-lucide="separator-horizontal"></i><i data-lucide="settings-2"></i>
  </div>

  <div class="strip">
    <div class="chip skeleton"></div>
    <div class="chip skeleton"></div>
    <div class="chip skeleton" style="opacity:.5;"></div>
  </div>

  <div class="doc-wrap">
    <div class="sheet a4 measuring">
      <div class="spinner"></div>
      <div style="font-size:13.5px; color:var(--text-secondary);">Готовим страницы…</div>
      <div style="font-size:11.5px; max-width:240px;">
        Загружаем шрифт документа. Разбивка появится, когда он будет готов.
      </div>
      <div style="width:100%; margin-top:10px;">
        <div class="skeleton-line" style="width:62%; height:16px; margin-bottom:12px;"></div>
        <div class="skeleton-line" style="margin-bottom:8px;"></div>
        <div class="skeleton-line" style="margin-bottom:8px;"></div>
        <div class="skeleton-line" style="width:84%; margin-bottom:8px;"></div>
        <div class="skeleton-line" style="width:92%;"></div>
      </div>
    </div>
  </div>

  <div class="statusbar">
    <span>Расчёт страниц…</span>
    <span>A4</span>
  </div>
  <script>lucide.createIcons();</script>
</body>
</html>
