<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Textery — Создание проекта (модалка типа)</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/navbar.css">
  <link rel="stylesheet" href="css/theme-switch.css">
  <link rel="stylesheet" href="css/navbar-placement.css">
  <link rel="stylesheet" href="css/profile-menu.css">
  <link rel="stylesheet" href="css/projects-screen.css">
  <link rel="stylesheet" href="css/projects-toolbar.css">
  <link rel="stylesheet" href="css/projects-toolbar-mobile.css">
  <link rel="stylesheet" href="css/projects-page.css">
  <link rel="stylesheet" href="css/project-card.css">
  <link rel="stylesheet" href="css/projects-list.css">
  <link rel="stylesheet" href="css/projects-mobile.css">
  <link rel="stylesheet" href="css/projects-dark.css">
  <link rel="stylesheet" href="css/modal.css">
  <link rel="stylesheet" href="css/type-modal.css">
  <link rel="stylesheet" href="css/type-card.css">
  <link rel="stylesheet" href="css/projects-empty.css"></head>
<body>
  <div class="projects-shell">
    <div class="projects-screen">
      <div data-mock="navbar"></div>

      <div class="projects-header">
        <div class="projects-titles">
          <h1 class="projects-heading">Мои проекты</h1>
          <p class="projects-subtitle">Все ваши рефераты, курсовые, статьи и другие работы — в одном месте</p>
        </div>
      </div>

      <div data-mock="toolbar" data-view="grid"></div>

      <section class="projects-section projects-section-recent">
        <h2 class="projects-section-title">Недавние проекты</h2>
        <div class="projects-page" data-feed="4"></div>
      </section>

      <section class="projects-section">
        <h2 class="projects-section-title">Все проекты</h2>
        <div class="projects-page" data-feed="11"></div>
      </section>

    </div>
  </div>
  <!-- Модалка выбора типа — снимок ТЕКУЩЕГО компонента (TypeModal.tsx + TypeCard.tsx),
       а не фрейма: с ней и будем сравнивать дизайн. -->
  <div class="modal-backdrop type-modal-backdrop">
    <div class="modal type-modal-panel">
      <div class="modal-header">
        <h1>Создание проекта</h1>
        <button type="button" class="close-btn" aria-label="Закрыть">
          <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M3 3l10 10M13 3L3 13" stroke="currentColor" stroke-width="1.5"
                  stroke-linecap="round" />
          </svg>
        </button>
      </div>
      <p class="modal-subtitle">
        Выберите <span class="modal-subtitle-accent">тип документа</span>, с которым будете работать
      </p>
      <h2 class="type-group-heading">Учебные</h2>
      <div class="type-grid" data-types></div>
    </div>
  </div>

  <script src="mock-data.js"></script>
  <script src="mock.js"></script>
  <script src="mock-type-modal.js"></script>
</body>
</html>
