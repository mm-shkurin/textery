<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1640">
<title>Textery — Нейросеть анализирует задачу</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<link rel="stylesheet" href="theme.css">
<style>
  .analyzing{height:calc(100vh - 200px); display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center;}
  .halo{width:76px; height:76px; border-radius:50%; background:var(--accent-soft);
    display:flex; align-items:center; justify-content:center; margin-bottom:26px;
    animation:pulse 1.8s ease-in-out infinite;}
  .halo i{width:30px; height:30px; color:var(--accent);}
  @keyframes pulse{0%,100%{transform:scale(1); opacity:1;} 50%{transform:scale(1.08); opacity:.75;}}
  .analyzing h2{font-size:20px;}
  .analyzing .sub{color:var(--text-secondary); margin-top:6px;}
  .dots{display:flex; gap:7px; margin:22px 0 26px;}
  .dots span{width:8px; height:8px; border-radius:50%; background:var(--accent);
    animation:blink 1.2s infinite;}
  .dots span:nth-child(2){animation-delay:.2s;}
  .dots span:nth-child(3){animation-delay:.4s;}
  @keyframes blink{0%,100%{opacity:.25;} 50%{opacity:1;}}
  .analyzing .foot{font-size:12.5px; color:var(--text-muted); max-width:320px;}
</style>
</head>
<body>
  <div class="header">
    <div class="logo"><div class="logo-mark">T<span>AI</span></div>Textery</div>
    <div class="header-actions">
      <button class="icon-btn"><i data-lucide="bell"></i></button>
      <div class="avatar">АИ</div>
      <i data-lucide="chevron-down"></i>
    </div>
  </div>

  <div class="page">
    <div class="analyzing">
      <div class="halo"><i data-lucide="sparkles"></i></div>
      <h2>Нейросеть анализирует задачу</h2>
      <div class="sub">Подбираем структуру…</div>
      <div class="dots"><span></span><span></span><span></span></div>
      <div class="foot">Мы автоматически заполним параметры генерации на основе вашей темы</div>
    </div>
  </div>
  <script>lucide.createIcons();</script>
</body>
</html>
