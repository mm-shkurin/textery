<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=375">
<title>Textery — Мой профиль · не загрузился · мобильный</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<link rel="stylesheet" href="../desktop/theme.css">
<link rel="stylesheet" href="../desktop/profile.css">
<link rel="stylesheet" href="mobile.css">
</head>
<body>
<!-- GET /me не ответил (таймаут или 5xx) и повторы исчерпаны. Экран заканчивается сообщением
     с «Повторить», а не вечным спиннером: спиннер без предела неотличим от зависшей вкладки.
     Шапка деградировала тем же отказом — и это видно (пунктирный аватар), потому что молчаливо
     здоровая шапка читалась бы как «аккаунт без имени». Меню и «Выйти» продолжают работать. -->

<div class="header">
  <div class="logo"><div class="logo-mark">T<span>AI</span></div>Textery</div>
  <div class="header-actions">
    <button class="icon-btn"><i data-lucide="bell"></i></button>
    <div class="profile-menu">
      <div class="profile-trigger">
        <div class="avatar is-degraded"><i data-lucide="alert-triangle"></i></div>
        <i data-lucide="chevron-down"></i>
      </div>
    </div>
  </div>
</div>

<div class="page">
  <h1>Мой профиль</h1>
  <div class="subtitle">Данные вашей учётной записи</div>

  <div class="profile-wrap">
    <div class="card">
      <div class="state">
        <div class="art"><i data-lucide="cloud-off"></i></div>
        <h2>Не удалось загрузить профиль</h2>
        <p>Данные учётной записи сейчас недоступны. Ничего не потеряно — попробуйте ещё раз
          через минуту.</p>
        <div class="state-actions">
          <button class="btn btn-primary"><i data-lucide="rotate-cw"></i>Повторить</button>
          <button class="btn btn-ghost">К проектам</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="footer">
  <div class="logo"><div class="logo-mark">T<span>AI</span></div>Textery</div>
  <div>© 2026 Textery. Все права защищены.</div>
  <div class="foot-links">
    <span>Условия использования</span><span>Политика конфиденциальности</span><span>Поддержка</span>
  </div>
</div>
<script>lucide.createIcons();</script>
</body>
</html>
