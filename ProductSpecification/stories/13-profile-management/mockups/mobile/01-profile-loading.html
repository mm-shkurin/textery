<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=375">
<title>Textery — Мой профиль · загрузка · мобильный</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<link rel="stylesheet" href="../desktop/theme.css">
<link rel="stylesheet" href="../desktop/profile.css">
<link rel="stylesheet" href="mobile.css">
</head>
<body>
<!-- GET /api/v1/auth/me ещё в полёте. Показываем определённый плейсхолдер, а не пустой
     аватар, который потом «выстрелит» инициалами: после переезда шапки на /me это состояние
     каждой страницы на время запроса, а не краевой случай. -->

<div class="header">
  <div class="logo"><div class="logo-mark">T<span>AI</span></div>Textery</div>
  <div class="header-actions">
    <button class="icon-btn"><i data-lucide="bell"></i></button>
    <div class="profile-menu">
      <div class="profile-trigger">
        <div class="avatar is-placeholder sk"><i data-lucide="user"></i></div>
        <i data-lucide="chevron-down"></i>
      </div>
    </div>
  </div>
</div>

<div class="page">
  <h1>Мой профиль</h1>
  <div class="subtitle">Данные вашей учётной записи</div>

  <div class="profile-wrap">
    <div class="card">
      <div class="identity">
        <div class="sk-ava sk"><i data-lucide="user"></i></div>
        <div class="who" style="flex:1;">
          <div class="sk sk-line" style="width:210px;"></div>
          <div class="sk sk-line" style="width:270px; height:10px; margin-top:12px;"></div>
          <div class="sk sk-line" style="width:150px; height:9px; margin-top:14px;"></div>
        </div>
      </div>

      <div class="divider"></div>

      <div class="form-title">Отображаемое имя</div>
      <div class="form-hint">Показывается в шапке и на этом экране вместо адреса почты.</div>

      <div class="field">
        <div class="label-row">
          <span class="label">Имя</span>
          <span class="counter">— / 60</span>
        </div>
        <div class="sk sk-input"></div>
      </div>

      <div class="actions">
        <button class="btn btn-ghost is-disabled">Отмена</button>
        <button class="btn btn-primary is-disabled">Сохранить</button>
      </div>
    </div>
  </div>
</div>

<div class="footer">
  <div class="logo"><div class="logo-mark">T<span>AI</span></div>Textery</div>
  <div>© 2026 Textery. Все права защищены.</div>
  <div class="foot-links">
    <span>Условия использования</span><span>Политика конфиденциальности</span><span>Поддержка</span>
  </div>
</div>
<script>lucide.createIcons();</script>
</body>
</html>
